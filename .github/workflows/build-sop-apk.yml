name: Build SOP Navigator APK

on:
  workflow_dispatch:
  push:
    branches: [ sop-navigator-v1 ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore valid legacy resource
        run: |
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          cat .github/icon-parts-valid/01.txt .github/icon-parts-valid/02.txt .github/icon-parts-valid/03.txt .github/icon-parts-valid/04.txt | tr -d '\\n\\r ' | base64 -d > app/src/main/res/mipmap-xxxhdpi/kr_launcher.png
          file app/src/main/res/mipmap-xxxhdpi/kr_launcher.png

      - name: Build unsigned release APK
        run: |
          export KR_VERSION_CODE=$((10000 + GITHUB_RUN_NUMBER))
          export KR_VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          gradle :app:assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SOP-Navigator-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
