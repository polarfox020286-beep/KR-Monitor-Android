name: Build SOP Navigator APK

on:
  workflow_dispatch:
  push:
    branches: [ sop-navigator-v1 ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        run: |
          export KR_VERSION_CODE=$((10000 + GITHUB_RUN_NUMBER))
          export KR_VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          gradle :app:assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SOP-Navigator-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
