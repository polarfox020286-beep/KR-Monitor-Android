name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle normalized catalog
        run: |
          test -s data/catalog.json
          cp data/catalog.json app/src/main/assets/seed_catalog.json
      - name: Assemble and verify launcher icon
        run: |
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          cat .github/icon-parts-valid/01.txt .github/icon-parts-valid/02.txt .github/icon-parts-valid/03.txt .github/icon-parts-valid/04.txt | tr -d '\n\r ' | base64 -d > app/src/main/res/mipmap-xxxhdpi/kr_launcher.png
          echo 'e5f879c76f6511515b6c550feac54a0dee4de2ef99ad75108066f2de7a83566a  app/src/main/res/mipmap-xxxhdpi/kr_launcher.png' | sha256sum -c -
          file app/src/main/res/mipmap-xxxhdpi/kr_launcher.png
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: KR-Monitor-APK
          path: app/build/outputs/apk/debug/app-debug.apk
