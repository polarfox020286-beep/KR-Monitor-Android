name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle normalized catalog
        run: |
          test -s data/catalog.json
          cp data/catalog.json app/src/main/assets/seed_catalog.json
      - name: Prepare verified launcher icon
        env:
          ICON_B64: >-
            
        run: |
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          printf '%s' "$ICON_B64" | base64 -d > app/src/main/res/mipmap-xxxhdpi/kr_launcher.png
          test -s app/src/main/res/mipmap-xxxhdpi/kr_launcher.png
          file app/src/main/res/mipmap-xxxhdpi/kr_launcher.png
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: KR-Monitor-APK
          path: app/build/outputs/apk/debug/app-debug.apk
