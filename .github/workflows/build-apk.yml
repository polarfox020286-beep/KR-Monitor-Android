name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Require persistent signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo 'Missing ANDROID_KEYSTORE_BASE64 secret'; exit 1; }
          test -n "$STORE_PASSWORD" || { echo 'Missing ANDROID_KEYSTORE_PASSWORD secret'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Missing ANDROID_KEY_ALIAS secret'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing ANDROID_KEY_PASSWORD secret'; exit 1; }

      - name: Restore release signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/kr-navigator-release.jks"
          test -s "$RUNNER_TEMP/kr-navigator-release.jks"

      - name: Bundle normalized catalog
        run: |
          test -s data/catalog.json
          cp data/catalog.json app/src/main/assets/seed_catalog.json

      - name: Assemble and verify launcher icon
        run: |
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          cat .github/icon-parts-valid/01.txt .github/icon-parts-valid/02.txt .github/icon-parts-valid/03.txt .github/icon-parts-valid/04.txt | tr -d '\n\r ' | base64 -d > app/src/main/res/mipmap-xxxhdpi/kr_launcher.png
          echo 'e5f879c76f6511515b6c550feac54a0dee4de2ef99ad75108066f2de7a83566a  app/src/main/res/mipmap-xxxhdpi/kr_launcher.png' | sha256sum -c -
          file app/src/main/res/mipmap-xxxhdpi/kr_launcher.png

      - name: Build signed release APK
        env:
          KR_VERSION_CODE: ${{ github.run_number }}
          KR_VERSION_NAME: 1.0.${{ github.run_number }}
          KR_KEYSTORE_FILE: ${{ runner.temp }}/kr-navigator-release.jks
          KR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KR-Navigator-APK
          path: app/build/outputs/apk/release/app-release.apk
