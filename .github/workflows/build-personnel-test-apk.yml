name: Build personnel filter test APK

on:
  workflow_dispatch:
  push:
    branches: [ personnel-filter-apk-test ]
    paths-ignore:
      - 'dist/**'

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare splash asset
        run: |
          mkdir -p app/src/main/assets
          cp app/src/main/res/drawable-nodpi/sop_splash.webp app/src/main/assets/sop_splash.webp

      - name: Build test APK
        env:
          RUN_NUM: ${{ github.run_number }}
        run: |
          export KR_VERSION_CODE=$((20000 + RUN_NUM))
          export KR_VERSION_NAME="test-${RUN_NUM}"
          gradle :app:assembleDebug --stacktrace

      - name: Make v1-signed APK suitable for chat artifact packaging
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$APKSIGNER"
          test -f "$HOME/.android/debug.keystore"
          "$APKSIGNER" sign             --ks "$HOME/.android/debug.keystore"             --ks-key-alias androiddebugkey             --ks-pass pass:android             --key-pass pass:android             --v1-signing-enabled true             --v2-signing-enabled false             --v3-signing-enabled false             --v4-signing-enabled false             --out /tmp/personnel-v1.apk             app/build/outputs/apk/debug/app-debug.apk
          "$APKSIGNER" verify --verbose /tmp/personnel-v1.apk
          mkdir -p chat_apk_root
          unzip -q /tmp/personnel-v1.apk -d chat_apk_root

      - name: Upload installable APK bytes as artifact archive
        uses: actions/upload-artifact@v4
        with:
          name: SOP-Navigator-personnel-filter-chat-apk
          path: chat_apk_root/
          compression-level: 0
          include-hidden-files: true

      - name: Verify downloaded artifact archive is itself an installable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ART_ID=""
          for i in 1 2 3 4 5 6; do
            ART_ID=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts"               | jq -r '.artifacts[] | select(.name=="SOP-Navigator-personnel-filter-chat-apk") | .id' | head -1)
            [ -n "$ART_ID" ] && [ "$ART_ID" != "null" ] && break
            sleep 3
          done
          test -n "$ART_ID"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"             -o /tmp/SOP-Navigator-personnel-filter-test.apk             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ART_ID/zip"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs /tmp/SOP-Navigator-personnel-filter-test.apk
          unzip -l /tmp/SOP-Navigator-personnel-filter-test.apk | grep -q "AndroidManifest.xml"

      - name: Publish ordinary APK to branch
        run: |
          mkdir -p dist
          cp /tmp/personnel-v1.apk dist/SOP-Navigator-personnel-filter-test.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/SOP-Navigator-personnel-filter-test.apk
          git commit -m "Publish personnel filter test APK [skip ci]" || exit 0
          git push
