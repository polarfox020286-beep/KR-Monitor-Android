name: Build personnel filter test APK

on:
  workflow_dispatch:
  push:
    branches: [ personnel-filter-apk-test ]
    paths-ignore:
      - 'dist/**'

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare splash asset
        run: |
          mkdir -p app/src/main/assets
          cp app/src/main/res/drawable-nodpi/sop_splash.webp app/src/main/assets/sop_splash.webp

      - name: Build installable test APK
        env:
          RUN_NUM: ${{ github.run_number }}
        run: |
          export KR_VERSION_CODE=$((20000 + RUN_NUM))
          export KR_VERSION_NAME="test-${RUN_NUM}"
          gradle :app:assembleDebug --stacktrace

      - name: Prepare artifact-as-APK
        run: |
          rm -rf apkroot
          mkdir apkroot
          unzip -q app/build/outputs/apk/debug/app-debug.apk -d apkroot

      - name: Upload installable APK container
        id: upload_apk_container
        uses: actions/upload-artifact@v4
        with:
          name: SOP-Navigator-personnel-filter-installable
          path: apkroot/
          include-hidden-files: true
          compression-level: 6

      - name: Verify downloaded artifact itself is an APK
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload_apk_container.outputs.artifact-id }}
        run: |
          curl -fL             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip"             -o /tmp/SOP-Navigator-personnel-filter-test.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs /tmp/SOP-Navigator-personnel-filter-test.apk

      - name: Publish conventional APK to branch
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SOP-Navigator-personnel-filter-test.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/SOP-Navigator-personnel-filter-test.apk
          git commit -m "Publish personnel filter test APK [skip ci]" || exit 0
          git push
