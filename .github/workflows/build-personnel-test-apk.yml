name: Build personnel filter test APK

on:
  workflow_dispatch:
  push:
    branches: [ personnel-filter-apk-test ]
    paths-ignore:
      - 'dist/**'

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare fixed test signing key
        run: |
          echo '' | base64 -d > /tmp/sop-test-fixed.keystore
          keytool -list -keystore /tmp/sop-test-fixed.keystore -storepass soptest123 -alias soptest >/dev/null

      - name: Prepare splash asset
        run: |
          mkdir -p app/src/main/assets
          cp app/src/main/res/drawable-nodpi/sop_splash.webp app/src/main/assets/sop_splash.webp

      - name: Build test APK
        env:
          RUN_NUM: ${{ github.run_number }}
          KR_KEYSTORE_FILE: /tmp/sop-test-fixed.keystore
          KR_KEYSTORE_PASSWORD: soptest123
          KR_KEY_ALIAS: soptest
          KR_KEY_PASSWORD: soptest123
        run: |
          export KR_VERSION_CODE=$((30000 + RUN_NUM))
          export KR_VERSION_NAME="personnel-test-${RUN_NUM}"
          gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | head -n 5

      - name: Prepare raw APK artifact
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/debug/app-debug.apk artifact/SOP-Navigator-personnel-filter-stable-test.apk

      - name: Upload raw APK file
        uses: actions/upload-artifact@v4
        with:
          name: SOP-Navigator-personnel-filter-stable-raw-apk
          path: artifact/SOP-Navigator-personnel-filter-stable-test.apk
          compression-level: 0
          if-no-files-found: error

      - name: Publish ordinary APK to branch
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SOP-Navigator-personnel-filter-stable-test.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/SOP-Navigator-personnel-filter-stable-test.apk
          git commit -m "Publish stable-signed personnel filter test APK [skip ci]" || exit 0
          git push
