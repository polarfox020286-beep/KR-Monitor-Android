name: UI Quality Checks

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/src/main/**'
      - 'app/src/androidTest/**'
      - 'app/build.gradle'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/ui-tests.yml'

concurrency:
  group: ui-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-smoke:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: phone-320x640-font100
            width: 320
            height: 640
            font_scale: '1.0'
          - name: phone-360x800-font160
            width: 360
            height: 800
            font_scale: '1.6'
          - name: phone-430x932-font130
            width: 430
            height: 932
            font_scale: '1.3'
          - name: landscape-800x400-font100
            width: 800
            height: 400
            font_scale: '1.0'
          - name: tablet-800x1280-font100
            width: 800
            height: 1280
            font_scale: '1.0'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare local catalog
        run: |
          mkdir -p app/src/main/assets
          test -s data/catalog.json
          cp data/catalog.json app/src/main/assets/seed_catalog.json

      - name: Assemble launcher icon
        run: |
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          cat .github/icon-parts-valid/01.txt .github/icon-parts-valid/02.txt .github/icon-parts-valid/03.txt .github/icon-parts-valid/04.txt | tr -d '\n\r ' | base64 -d > app/src/main/res/mipmap-xxxhdpi/kr_launcher.png
          echo 'e5f879c76f6511515b6c550feac54a0dee4de2ef99ad75108066f2de7a83566a  app/src/main/res/mipmap-xxxhdpi/kr_launcher.png' | sha256sum -c -

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run UI smoke test on ${{ matrix.name }}
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euxo pipefail

            adb shell wm size ${{ matrix.width }}x${{ matrix.height }}
            adb shell wm density 160
            adb shell settings put system font_scale ${{ matrix.font_scale }}
            sleep 2

            echo "=== Effective display ==="
            adb shell wm size
            adb shell wm density
            adb shell settings get system font_scale

            gradle :app:connectedDebugAndroidTest --stacktrace

            OUT="$GITHUB_WORKSPACE/ui-artifacts/${{ matrix.name }}"
            mkdir -p "$OUT"

            adb pull /sdcard/Android/data/ru.krmonitor.app/files/ui-screenshots "$OUT/screenshots" || true
            adb exec-out screencap -p > "$OUT/final-screen.png" || true
            adb shell uiautomator dump /sdcard/window.xml || true
            adb pull /sdcard/window.xml "$OUT/window.xml" || true

      - name: Collect Android test reports
        if: always()
        run: |
          OUT="ui-artifacts/${{ matrix.name }}"
          mkdir -p "$OUT"
          if [ -d app/build/reports/androidTests ]; then
            cp -R app/build/reports/androidTests "$OUT/test-reports"
          fi
          if [ -d app/build/outputs/androidTest-results ]; then
            cp -R app/build/outputs/androidTest-results "$OUT/test-results"
          fi

      - name: Upload UI screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-${{ matrix.name }}
          path: ui-artifacts/${{ matrix.name }}
          if-no-files-found: warn
          retention-days: 14
