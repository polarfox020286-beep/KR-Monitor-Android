name: Apply vector profile icons
on:
  push:
    branches: [ main ]
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace symbolic profile icon with vector view
        run: |
          python3 - <<'PY'
          from pathlib import Path
          f=Path('app/src/main/java/ru/krmonitor/app/MainActivity.java')
          s=f.read_text()
          old='''        TextView icon=text(profileIcon(profile),18,BLUE,true);\n        icon.setGravity(Gravity.CENTER);\n        icon.setIncludeFontPadding(false);\n        icon.setBackground(rounded(BLUE_SOFT,Color.TRANSPARENT,17));\n        LinearLayout.LayoutParams iconLp=new LinearLayout.LayoutParams(dp(34),dp(34));\n        iconLp.setMargins(0,0,0,dp(6));\n        card.addView(icon,iconLp);'''
          new='''        ProfileIconView icon=new ProfileIconView(this,profile);\n        LinearLayout.LayoutParams iconLp=new LinearLayout.LayoutParams(dp(44),dp(44));\n        iconLp.setMargins(0,0,0,dp(6));\n        card.addView(icon,iconLp);'''
          if old in s:
              s=s.replace(old,new,1)
              f.write_text(s)
          PY
      - name: Commit UI update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/ru/krmonitor/app/MainActivity.java
          git commit -m 'Use vector medical icons on profile cards'
          git push
