name: Audit KR profile classification

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-profiles.yml'
      - 'app/src/main/java/ru/krmonitor/app/ProfileClassifier.java'
      - 'data/catalog.json'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile classifier and audit title plus ICD-10
        shell: bash
        run: |
          mkdir -p audit/ru/krmonitor/app
          cp app/src/main/java/ru/krmonitor/app/ProfileClassifier.java audit/ru/krmonitor/app/
          cp app/src/main/java/ru/krmonitor/app/Recommendation.java audit/ru/krmonitor/app/
          python - <<'PY'
          import json
          from pathlib import Path
          items=json.loads(Path('data/catalog.json').read_text(encoding='utf-8'))
          rows=[]
          for x in items:
              vals=[str(x.get('id','')),str(x.get('title','')),str(x.get('mkb',''))]
              j=[json.dumps(v,ensure_ascii=False) for v in vals]
              rows.append(f'new Recommendation("",{j[0]},{j[1]},"",{j[2]})')
          arr=',\n'.join(rows)
          src=f'''import java.util.*;\nimport ru.krmonitor.app.*;\npublic class ProfileCatalogAudit {{\n  static void require(boolean v,String m) {{ if(!v) throw new RuntimeException(m); }}\n  static void expect(String mkb,String profile) {{\n    Recommendation r=new Recommendation("","TEST","Новая клиническая рекомендация без профильных слов","",mkb);\n    Set<String> g=ProfileClassifier.groupsFor(r);\n    require(g.contains(profile),mkb+" -> ожидается "+profile+", получено "+g);\n    require(!g.contains("Общие и междисциплинарные"),mkb+" ошибочно осталось в Общих");\n  }}\n  public static void main(String[] args) {{\n    Recommendation[] recs=new Recommendation[]{{{arr}}};\n    int general=0;\n    for(Recommendation r:recs) {{\n      Set<String> g=ProfileClassifier.groupsFor(r);\n      if(g.contains("Общие и междисциплинарные")) {{ general++; System.out.println("GENERAL|"+r.title+"|"+r.mkbCodes); }}\n      require(!g.isEmpty(),"Пустой профиль: "+r.title);\n    }}\n    expect("I21.0","Кардиология");\n    expect("I63.9","Неврология");\n    expect("I70.2","Сердечно-сосудистая хирургия");\n    expect("J44.9","Пульмонология");\n    expect("N18.4","Нефрология");\n    expect("N40","Урология");\n    expect("O14.1","Акушерство и гинекология");\n    expect("M32.9","Ревматология");\n    expect("H40.1","Офтальмология");\n    expect("H90.3","Оториноларингология");\n    expect("C34.9","Онкология");\n    expect("F32.1","Психиатрия и наркология");\n    expect("G35","Неврология");\n    expect("S72.0","Травматология и ортопедия");\n    expect("Z50.9","Медицинская реабилитация");\n    expect("K35.8","Хирургия");\n    expect("D80.1","Аллергология и иммунология");\n    System.out.println("TOTAL="+recs.length+" GENERAL="+general);\n    System.out.println("Title + ICD-10 profile checks: OK");\n  }}\n}}'''
          Path('audit/ProfileCatalogAudit.java').write_text(src,encoding='utf-8')
          PY
          cd audit
          javac -encoding UTF-8 ru/krmonitor/app/Recommendation.java ru/krmonitor/app/ProfileClassifier.java ProfileCatalogAudit.java
          java -Dfile.encoding=UTF-8 ProfileCatalogAudit
