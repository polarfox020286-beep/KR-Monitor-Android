name: Fix exact ID search

on:
  push:
    paths:
      - '.github/workflows/fix-exact-id-search.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Patch exact ID search
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/ru/krmonitor/app/MainActivity.java')
          s=p.read_text(encoding='utf-8')
          old='''    private void renderSearch(String q) {\n        String needle=norm(q);\n        boolean mkbQuery=MkbUtils.looksLikeCode(q);\n        searchShowsMkb=mkbQuery;\n        ArrayList<Recommendation> results=new ArrayList<>();\n        for(Recommendation r:all) {\n            if(norm(r.title).contains(needle)||norm(r.id).contains(needle)||MkbUtils.matches(r.mkbCodes,q)) results.add(r);\n        }\n        String heading=mkbQuery ? "МКБ-10: "+q.toUpperCase(Locale.ROOT) : "Результаты поиска";\n        showContent(makeListPage(heading,results),0);\n    }'''
          new='''    private void renderSearch(String q) {\n        String raw=q==null?"":q.trim();\n        String needle=norm(raw);\n        boolean idQuery=raw.matches("\\\\d+(?:_\\\\d+)?");\n        boolean mkbQuery=!idQuery && MkbUtils.looksLikeCode(raw);\n        searchShowsMkb=mkbQuery;\n        ArrayList<Recommendation> results=new ArrayList<>();\n\n        if(idQuery) {\n            for(Recommendation r:all) {\n                if(raw.equalsIgnoreCase(r.id) || raw.equalsIgnoreCase(r.baseId)) results.add(r);\n            }\n            // Only when there is no exact ID, allow prefix suggestions for an unfinished number.\n            if(results.isEmpty()) {\n                for(Recommendation r:all) {\n                    if(r.baseId!=null && r.baseId.startsWith(raw)) results.add(r);\n                }\n            }\n        } else {\n            for(Recommendation r:all) {\n                if(norm(r.title).contains(needle) || MkbUtils.matches(r.mkbCodes,raw)) results.add(r);\n            }\n        }\n\n        String heading=idQuery ? "КР "+raw : (mkbQuery ? "МКБ-10: "+raw.toUpperCase(Locale.ROOT) : "Результаты поиска");\n        showContent(makeListPage(heading,results),0);\n    }'''
          if old not in s:
              raise SystemExit('renderSearch block not found')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Compile change
        run: gradle :app:compileDebugJavaWithJavac --stacktrace
      - name: Commit change and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-exact-id-search.yml
          git add app/src/main/java/ru/krmonitor/app/MainActivity.java
          git commit -m 'Fix exact clinical recommendation ID search'
          git push
