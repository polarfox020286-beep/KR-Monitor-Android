name: Refresh catalog metadata

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    paths:
      - '.github/workflows/refresh-catalog.yml'
      - 'scripts/build_seed.py'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build normalized catalog
        run: |
          pip install requests beautifulsoup4
          python scripts/build_seed.py
          mkdir -p data
          cp app/src/main/assets/seed_catalog.json data/catalog.json
      - name: Publish catalog only when changed
        run: |
          if [ -z "$(git status --porcelain -- data/catalog.json)" ]; then
            echo 'Catalog unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog.json
          git commit -m 'Refresh catalog metadata [skip ci]'
          git push
