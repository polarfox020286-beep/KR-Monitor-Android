name: Apply ICD-10 search
on:
  push:
    branches: [ main ]
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch application for ICD-10 search
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # CatalogFetcher: retain official Mkbs data and fallback metadata.
          f=Path('app/src/main/java/ru/krmonitor/app/CatalogFetcher.java')
          s=f.read_text()
          s=s.replace('add(result,id,title);','add(result,id,title,MkbUtils.extract(o.opt("Mkbs")));',1)
          s=s.replace('add(result,o.optString("id","").trim(),o.optString("title","").trim());','add(result,o.optString("id","").trim(),o.optString("title","").trim(),o.optString("mkb","").trim());',1)
          s=s.replace('private static void add(Map<String,Recommendation> result,String id,String title) {','private static void add(Map<String,Recommendation> result,String id,String title,String mkb) {',1)
          s=s.replace('Recommendation cur=new Recommendation(base,id,title,"KR"+id+".pdf");','Recommendation cur=new Recommendation(base,id,title,"KR"+id+".pdf",mkb);',1)
          f.write_text(s)

          # SeedImporter: import MKB codes into SQLite without destroying history.
          f=Path('app/src/main/java/ru/krmonitor/app/SeedImporter.java')
          s=f.read_text()
          s=s.replace('String title=o.getString("title").trim();','String title=o.getString("title").trim();\n            String mkb=o.optString("mkb","").trim();',1)
          s=s.replace('db.upsert(new Recommendation(base,id,title,"KR"+id+".pdf"),"");','db.upsert(new Recommendation(base,id,title,"KR"+id+".pdf",mkb),"");',1)
          f.write_text(s)

          # MainActivity: one search box for title, ID and ICD-10.
          f=Path('app/src/main/java/ru/krmonitor/app/MainActivity.java')
          s=f.read_text()
          s=s.replace('private boolean swipeTracking=false;','private boolean swipeTracking=false;\n    private boolean searchShowsMkb=false;',1)
          s=s.replace('search.setHint("Найти клиническую рекомендацию или ID");','search.setHint("Название, номер КР или код МКБ-10");',1)
          s=s.replace('private void renderCurrentPage(int direction) {\n        if(contentHost==null) return;','private void renderCurrentPage(int direction) {\n        if(contentHost==null) return;\n        searchShowsMkb=false;',1)
          old='''    private void renderSearch(String q) {\n        String needle=norm(q);\n        ArrayList<Recommendation> results=new ArrayList<>();\n        for(Recommendation r:all) {\n            if(norm(r.title).contains(needle)||norm(r.id).contains(needle)) results.add(r);\n        }\n        showContent(makeListPage("Результаты поиска",results),0);\n    }'''
          new='''    private void renderSearch(String q) {\n        String needle=norm(q);\n        boolean mkbQuery=MkbUtils.looksLikeCode(q);\n        searchShowsMkb=mkbQuery;\n        ArrayList<Recommendation> results=new ArrayList<>();\n        for(Recommendation r:all) {\n            if(norm(r.title).contains(needle)||norm(r.id).contains(needle)||MkbUtils.matches(r.mkbCodes,q)) results.add(r);\n        }\n        String heading=mkbQuery ? "МКБ-10: "+q.toUpperCase(Locale.ROOT) : "Результаты поиска";\n        showContent(makeListPage(heading,results),0);\n    }'''
          if old not in s:
              raise SystemExit('renderSearch pattern not found')
          s=s.replace(old,new,1)
          old='''                TextView meta=text("КР "+r.id+(PdfManager.isPdf(PdfManager.file(MainActivity.this,r))?"  •  PDF скачан":""),11,MUTED,false);'''
          new='''                String metaText="КР "+r.id+(PdfManager.isPdf(PdfManager.file(MainActivity.this,r))?"  •  PDF скачан":"");\n                if(searchShowsMkb && r.mkbCodes!=null && !r.mkbCodes.isEmpty()) metaText += "  •  МКБ-10: "+r.mkbCodes;\n                TextView meta=text(metaText,11,MUTED,false);'''
          if old not in s:
              raise SystemExit('meta pattern not found')
          s=s.replace(old,new,1)
          f.write_text(s)

          # Server-side normalized seed/fallback catalog with MKB codes.
          f=Path('scripts/build_seed.py')
          s=f.read_text()
          s=s.replace('import json\n','import json\nimport re\n',1)
          marker='''def version(cid: str) -> int:\n'''
          helper='''ICD_RE = re.compile(r"(?<![A-Z0-9])([A-Z][0-9]{2}(?:\\.[0-9A-Z]{1,2})?)(?![A-Z0-9])", re.I)\n\n\ndef extract_mkb(value) -> str:\n    if value is None:\n        return ""\n    text = value if isinstance(value, str) else json.dumps(value, ensure_ascii=False)\n    found = []\n    seen = set()\n    for code in ICD_RE.findall(text.upper()):\n        if code not in seen:\n            seen.add(code)\n            found.append(code)\n    return ", ".join(found)\n\n\n'''
          if helper not in s:
              s=s.replace(marker,helper+marker,1)
          s=s.replace('title = str(row.get("Name") or row.get("name") or "").strip()','title = str(row.get("Name") or row.get("name") or "").strip()\n            mkb = extract_mkb(row.get("Mkbs") or row.get("mkbs"))',1)
          s=s.replace('records[base] = {"id": cid, "title": title}','records[base] = {"id": cid, "title": title, "mkb": mkb}',1)
          f.write_text(s)
          PY
      - name: Commit ICD-10 search support
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/ru/krmonitor/app/CatalogFetcher.java app/src/main/java/ru/krmonitor/app/SeedImporter.java app/src/main/java/ru/krmonitor/app/MainActivity.java scripts/build_seed.py
          git commit -m 'Add ICD-10 search to KR Navigator'
          git push
