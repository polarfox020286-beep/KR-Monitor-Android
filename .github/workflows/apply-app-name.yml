name: Apply app name

on:
  push:
    paths:
      - '.github/workflows/apply-app-name.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename app to KR Navigator
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('app/src/main/java/ru/krmonitor/app/MainActivity.java')
          s = main.read_text(encoding='utf-8')
          old = 'TextView title=text("Монитор КР",23,TEXT,true);'
          new = 'TextView title=text("КР Навигатор",23,TEXT,true);'
          if old not in s:
              raise SystemExit('MainActivity title marker not found')
          main.write_text(s.replace(old, new, 1), encoding='utf-8')

          manifest = Path('app/src/main/AndroidManifest.xml')
          m = manifest.read_text(encoding='utf-8')
          old_label = 'android:label="Монитор КР"'
          new_label = 'android:label="КР Навигатор"'
          if old_label not in m:
              raise SystemExit('Manifest label marker not found')
          manifest.write_text(m.replace(old_label, new_label, 1), encoding='utf-8')

          Path('.github/workflows/apply-app-name.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/ru/krmonitor/app/MainActivity.java app/src/main/AndroidManifest.xml .github/workflows/apply-app-name.yml
          git commit -m 'Rename app to КР Навигатор'
          git push
