name: Build ICD-10 test APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh official catalog with ICD-10 metadata
        run: |
          pip install requests
          python scripts/build_seed.py
          mkdir -p data
          cp app/src/main/assets/seed_catalog.json data/catalog.json
      - name: Assemble launcher icon
        run: |
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          cat .github/icon-parts-valid/01.txt .github/icon-parts-valid/02.txt .github/icon-parts-valid/03.txt .github/icon-parts-valid/04.txt | tr -d '\n\r ' | base64 -d > app/src/main/res/mipmap-xxxhdpi/kr_launcher.png
      - name: Build debug APK
        env:
          KR_VERSION_CODE: '1001'
          KR_VERSION_NAME: '1.1.0-mkb'
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: KR-Navigator-MKB-debug
          path: app/build/outputs/apk/debug/app-debug.apk
