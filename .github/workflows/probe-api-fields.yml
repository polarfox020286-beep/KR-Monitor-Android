name: Probe official CR API fields
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-api-fields.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect fields
        shell: bash
        run: |
          python - <<'PY'
          import requests, json
          url='https://apicr.minzdrav.gov.ru/api.ashx?op=GetJsonClinrecsFilterV2'
          body={"filters":[{"fieldName":"status","filterType":1,"filterValueType":2,"value1":0,"value2":"","values":[]}],"sortOption":{"fieldName":"publishdate","sortType":2},"pageSize":5,"currentPage":1,"useANDoperator":True,"columns":[]}
          r=requests.post(url,json=body,timeout=60,headers={'User-Agent':'Mozilla/5.0 KR-Monitor-Probe','Referer':'https://cr.minzdrav.gov.ru/clin-rec','Origin':'https://cr.minzdrav.gov.ru','Accept':'application/json, text/plain, */*'})
          r.raise_for_status(); obj=r.json(); rows=obj.get('Data') or obj.get('data') or []
          print('TOP KEYS', sorted(obj.keys()))
          print('ROW KEYS', sorted(rows[0].keys()))
          for row in rows[:3]:
              print('ROW', json.dumps(row,ensure_ascii=False,sort_keys=True))
          PY
