name: Probe PDF backup connectivity

on:
  push:
    paths:
      - '.github/workflows/probe-pdf-backup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Minzdrav PDF endpoint from GitHub Actions
        run: |
          python3 - <<'PY'
          import urllib.request
          import urllib.error
          url = 'https://apicr.minzdrav.gov.ru/API.ashx?op=GetClinrecPdf&id=157_5'
          req = urllib.request.Request(url, headers={
              'User-Agent': 'Mozilla/5.0 (Linux; Android) KR-Monitor/1.2',
              'Accept': 'application/pdf,*/*'
          })
          try:
              with urllib.request.urlopen(req, timeout=35) as response:
                  magic = response.read(5)
                  print('HTTP:', response.status)
                  print('Content-Type:', response.headers.get('content-type'))
                  print('PDF signature valid:', magic == b'%PDF-')
                  if magic != b'%PDF-':
                      raise RuntimeError('Server returned non-PDF content')
          except Exception as exc:
              print('Connectivity check failed:', type(exc).__name__, str(exc)[:300])
              raise
          PY
