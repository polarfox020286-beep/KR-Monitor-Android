name: Build Yandex PDF test APK

on:
  workflow_dispatch:
  push:
    branches: [ sop-yandex-pdf-test-apk ]
    paths-ignore:
      - 'dist/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare splash asset
        run: |
          mkdir -p app/src/main/assets
          cp app/src/main/res/drawable-nodpi/sop_splash.webp app/src/main/assets/sop_splash.webp

      - name: Build installable test APK
        env:
          RUN_NUM: ${{ github.run_number }}
        run: |
          export KR_VERSION_CODE=$((30000 + RUN_NUM))
          export KR_VERSION_NAME="yandex-pdf-test-${RUN_NUM}"
          gradle :app:assembleDebug --stacktrace

      - name: Make APK downloadable from GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: SOP-Navigator-Yandex-PDF-test
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Publish APK on test branch
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SOP-Navigator-Yandex-PDF-test.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/SOP-Navigator-Yandex-PDF-test.apk
          git commit -m "Publish Yandex PDF test APK [skip ci]" || true
          git push || true

      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete sop-yandex-pdf-test -y --cleanup-tag || true
          gh release create sop-yandex-pdf-test \
            dist/SOP-Navigator-Yandex-PDF-test.apk \
            --target "${GITHUB_SHA}" \
            --title "SOP Navigator Yandex PDF test" \
            --notes "Test build: built-in PDF viewer and public Yandex Disk source." \
            --prerelease
