name: Probe Minzdrav CR source

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-minzdrav.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect official catalog modules
        run: |
          python - <<'PY'
          import re, requests
          base='https://cr.minzdrav.gov.ru/assets/'
          H={'User-Agent':'Mozilla/5.0','Referer':'https://cr.minzdrav.gov.ru/clin-rec','Accept':'*/*'}
          files=['api-8h5DlUEm.js','index-CrZYZ3QB.js','ClinrecProcessor-BazFULQ1.js']
          for f in files:
              r=requests.get(base+f,headers=H,timeout=45)
              print('\n##### FILE',f,'HTTP',r.status_code,'LEN',len(r.text),'#####')
              txt=r.text
              if f.startswith('api-'):
                  print('FULL_API_MODULE_START')
                  print(txt[:50000])
                  print('FULL_API_MODULE_END')
              for key in ['getClin','clinrec','clin-rec','recommend','axios','baseURL','fetch(','/api/','api.','pageSize','page_size','limit','offset','filter']:
                  for m in list(re.finditer(re.escape(key),txt,re.I))[:20]:
                      s=max(0,m.start()-350); e=min(len(txt),m.end()+650)
                      print('CONTEXT',key,' '.join(txt[s:e].split())[:1400])
              imports=sorted(set(re.findall(r'from["\']\./([^"\']+\.js)["\']',txt)))
              print('IMPORTS',imports)
          PY
