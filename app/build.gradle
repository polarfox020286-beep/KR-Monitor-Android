plugins { id 'com.android.application' }

def envVersionCode = System.getenv('KR_VERSION_CODE') ?: '10001'
def envVersionName = System.getenv('KR_VERSION_NAME') ?: '1.0.0'
def keystorePath = System.getenv('KR_KEYSTORE_FILE')
def keystorePassword = System.getenv('KR_KEYSTORE_PASSWORD')
def keyAliasValue = System.getenv('KR_KEY_ALIAS')
def keyPasswordValue = System.getenv('KR_KEY_PASSWORD')

android {
    namespace 'ru.krmonitor.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.sopnavigator.personnelfiltertest'
        minSdk 26
        targetSdk 35
        versionCode Integer.parseInt(envVersionCode)
        versionName envVersionName
    }

    signingConfigs {
        if (keystorePath) {
            release {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        debug {
            versionNameSuffix "-test"
            if (keystorePath) signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            if (keystorePath) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
